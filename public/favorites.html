<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="favorites.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<div class="bulk-actions" style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
    <button onclick="downloadAllAsZip()" style="background: #28a745; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer;">
        📦 お気に入りを一括ダウンロード (ZIP)
    </button>
    <button onclick="clearAllFavorites()" style="background: #dc3545; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer;">
        🗑️ お気に入りをすべて削除
    </button>
</div>
<div class="header-bar">
    <a href="/" class="back-link">← 検索に戻る</a>
    <h1>❤️ My Favorites</h1>
    
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('all')">すべて</button>
        <button class="tab-btn" onclick="switchTab('rule34')">Rule34</button>
        <button class="tab-btn" onclick="switchTab('gelbooru')">Gelbooru</button>
    </div>
</div>

<div id="app" class="gallery"></div>
<script>
    // localStorageから最新のデータを取得
    let likedPosts = JSON.parse(localStorage.getItem('likedPosts')) || [];

    function renderFavorites() {
        const app = document.getElementById('app');
        app.innerHTML = '';

        if (likedPosts.length === 0) {
            app.innerHTML = '<p style="text-align:center; margin-top:50px; color:#666;">お気に入りはまだありません。</p>';
            return;
        }

        likedPosts.forEach((post) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const fullUrl = `/img?url=${encodeURIComponent(post.url)}`;
            
            card.innerHTML = `
                <div class="btn-group" style="position: absolute; top: 10px; right: 10px; z-index: 50;">
                    <button class="remove-btn" onclick="removeFavorite('${post.id}')" 
                        style="background: rgba(255,0,0,0.8); color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; font-weight:bold;">
                        ❌ 削除
                    </button>
                </div>
                
                <a href="${fullUrl}" target="_blank">
                    <img src="${fullUrl}" alt="post" loading="lazy">
                </a>
            `;
            app.appendChild(card);
        });
    }

    // IDで検索して削除する関数
    function removeFavorite(postId) {
        if (!confirm('この画像をお気に入りから削除しますか？')) return;

        // 1. 削除実行の直前に、localStorageから最新のデータを読み直す（重要！）
        let currentPosts = JSON.parse(localStorage.getItem('likedPosts')) || [];

        // 2. IDが一致しないものだけを残す（＝特定の画像を削除）
        // ※IDが数値でも文字列でも比較できるように String() を使います
        const updatedPosts = currentPosts.filter(post => String(post.id) !== String(postId));

        // 3. ブラウザの保存領域を新しいリストで完全に上書きする
        localStorage.setItem('likedPosts', JSON.stringify(updatedPosts));

        // 4. メモリ上の変数も更新して、画面を再描画する
        likedPosts = updatedPosts;
        renderFavorites();
        
        console.log("削除完了。現在の保存数:", updatedPosts.length);
    }
    function clearAllFavorites() {
        if (!confirm('すべてのお気に入りを削除してもよろしいですか？この操作は取り消せません。')) return;
        
        localStorage.removeItem('likedPosts');
        likedPosts = [];
        renderFavorites();
        alert('すべて削除しました。');
        }
        async function downloadAllAsZip() {
        if (likedPosts.length === 0) {
            alert('ダウンロードする画像がありません。');
            return;
        }

        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "⏳ 準備中...";
        btn.disabled = true;

        const zip = new JSZip();
        const folder = zip.folder("my_favorites");

        try {
            const promises = likedPosts.map(async (post, index) => {
                // プロキシ経由で画像を取得
                const response = await fetch(`/img?url=${encodeURIComponent(post.url)}`);
                if (!response.ok) throw new Error(`Failed to fetch ${post.id}`);
                const blob = await response.blob();
                
                // ファイル名を作成（重複防止のためIDやIndexを付与）
                const fileName = `${post.site}_${post.id}.jpg`;
                folder.file(fileName, blob);
            });

            await Promise.all(promises);

            // ZIPファイルを生成してダウンロード
            const content = await zip.generateAsync({ type: "blob" });
            const zipUrl = window.URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = zipUrl;
            a.download = `danbo_favorites_${new Date().getTime()}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(zipUrl);

            alert('ダウンロードが完了しました！');
        } catch (e) {
            console.error("一括ダウンロード失敗:", e);
            alert('一部の画像の取得に失敗しました。');
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    // 初回実行
    renderFavorites();
</script>
