<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Booru AI Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2>AI Illustration Viewer</h2>
        <div class="search-box">
            <input id="search" placeholder="タグを選択または入力...">
            <button onclick="document.getElementById('search').value=''; newSearch();" style="background:#555;">クリア</button>
            <input id="min_score" type="number" placeholder="スコア" style="width: 60px;" value="0">
            <button onclick="newSearch()" style="background:#28a745;">この条件で検索</button>
        </div>
        <div class="controls" style="margin-top: 10px; display: flex; gap: 10px; justify-content: center; align-items: center;">
            <select id="site-select">
                <option value="rule34">Rule34</option>
                <option value="gelbooru">Gelbooru</option>
                <option value="pixiv">Pixiv (R18/AI)</option>
            </select>
                <button onclick="window.open('/favorites', '_blank')" style="background: #ff4757; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer;">
                    ❤️ 保存済み画像を見る
                </button>
        </div>
        <div id="status"></div>
    </div>

    <div id="app"></div>
    <div id="sentinel" style="height: 100px; clear: both; background: transparent;"></div>

    <script>
        let currentPage = 0;
        let isLoading = false;
        let hasMore = true;
        let isSearchStarted = false;

        // お気に入りリストをlocalStorageから読み込む
        let likedPosts = JSON.parse(localStorage.getItem('likedPosts')) || [];

        function newSearch() {
            document.getElementById('app').innerHTML = '';
            currentPage = 0;
            hasMore = true;
            isSearchStarted = true;
            search();
        }

        async function search() {
            if (isLoading || !hasMore) return;
            isLoading = true;

            const site = document.getElementById('site-select').value;
            const query = document.getElementById('search').value;
            const minScore = parseInt(document.getElementById('min_score').value) || 0;

            // Pixivかそれ以外かでURLを切り替え
            const endpoint = site === 'pixiv' ? '/api/pixiv/search' : '/api/search';
            const url = `${endpoint}?q=${encodeURIComponent(query)}&p=${currentPage}${site !== 'pixiv' ? `&site=${site}` : ''}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    hasMore = false;
                } else {
                    // Pixivの場合はフロント側でいいね数フィルタリングをかける
                    const filtered = site === 'pixiv' 
                        ? data.filter(item => item.score >= minScore) 
                        : data;
                    
                    renderPosts(filtered);
                    currentPage++;
                }
            } catch (e) {
                console.error("Search failed", e);
            } finally {
                isLoading = false;
            }
        }
        async function openModal(post) {
            let displayUrl = post.url;

            // PixivならオリジナルURLをオンデマンドで取得
            if (post.isPixiv) {
                const res = await fetch(`/api/pixiv/detail/${post.id}`);
                const detail = await res.json();
                displayUrl = detail.originalUrl;
            }

            const modalImg = document.getElementById('modal-img');
            modalImg.src = `/img?url=${encodeURIComponent(displayUrl)}`;
            document.getElementById('modal').style.display = 'flex';
        }
        function renderPosts(posts) {
            const app = document.getElementById('app');
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const proxiedUrl = `/img?url=${encodeURIComponent(post.previewUrl || post.url)}`;
                const postData = encodeURIComponent(JSON.stringify(post));
                const isLiked = likedPosts.some(p => String(p.id) === String(post.id));
                const rawDate = post.createdAt || post.created_at;

                card.innerHTML = `
                    <div class="media-container">
                        <div style="position: absolute; top: 0; left: 0; padding: 5px 10px; background: rgba(0,0,0,0.6); color: white; font-size: 10px; z-index: 10; pointer-events: none;">
                            ${formatDate(rawDate)}
                        </div>

                        <div style="position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 20;">
                            <button id="like-btn-${post.id}" onclick="event.stopPropagation(); toggleLike('${postData}')" 
                                style="background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;">
                                ${isLiked ? '❤️' : '🤍'}
                            </button>
                            <button onclick="event.stopPropagation(); downloadImage('${post.url}', '${post.id}')" 
                                style="background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;">
                                💾
                            </button>
                        </div>

                        <a href="${post.url}" target="_blank" style="display: block; width: 100%; height: 100%;">
                            <img src="${proxiedUrl}" alt="post" loading="lazy">
                        </a>

                        <div style="position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.5); color: #ffcc00; padding: 2px 6px; border-radius: 4px; font-size: 11px; pointer-events: none;">
                            ★ ${post.score}
                        </div>
                    </div>
                    
                    <div class="tags-container">
                        ${post.tags.split(' ').map(tag => `<span class="tag" onclick="jumpToTag('${tag}')">${tag}</span>`).join('')}
                    </div>
                `;
                app.appendChild(card);
            });
        }
        function toggleLike(encodedPostData) {
            const post = JSON.parse(decodeURIComponent(encodedPostData));
            const btn = document.getElementById(`like-btn-${post.id}`);
            const index = likedPosts.findIndex(p => String(p.id) === String(post.id));

            if (index === -1) {
                likedPosts.push(post);
                if (btn) {
                    btn.innerText = '❤️';
                    btn.classList.add('liked');
                    btn.style.transform = "scale(1.3)"; // 少し大きくする演出
                    setTimeout(() => btn.style.transform = "scale(1)", 200);
                }
            } else {
                likedPosts.splice(index, 1);
                if (btn) {
                    btn.innerText = '🤍';
                    btn.classList.remove('liked');
                }
            }

            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
        }

        function formatDate(dateStr) {
            if (!dateStr) return "不明";
            const date = new Date(dateStr);
            return isNaN(date.getTime()) ? "不明" : date.toLocaleDateString('ja-JP');
        }

        function jumpToTag(tagName) {
            const searchInput = document.getElementById('search');
            const currentText = searchInput.value.trim();
            const tags = currentText ? currentText.split(/\s+/) : [];
            if (!tags.includes(tagName)) {
                tags.push(tagName);
                searchInput.value = tags.join(" ");
                newSearch();
            }
        }

        async function downloadImage(url, id) {
            try {
                const response = await fetch(`/img?url=${encodeURIComponent(url)}`);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `booru_${id}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                console.error("保存失敗:", e);
            }
        }

        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting && isSearchStarted && !isLoading && hasMore) {
                search();
            }
        }, { rootMargin: '200px' });
        observer.observe(document.getElementById('sentinel'));
    </script>
</body>
</html>
