<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Booru AI Viewer</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="header">
        <h2>AI Illustration Viewer</h2>
        <div class="search-box">
            <input id="search" placeholder="タグを選択または入力...">
            <button id="clear-search-btn" class="secondary-btn">クリア</button>
            <input id="min_score" type="number" placeholder="スコア" value="0">
            <button id="search-btn" class="primary-btn">この条件で検索</button>
        </div>
        <div class="controls">
            <select id="site-select">
                <option value="rule34">Rule34</option>
                <option value="gelbooru">Gelbooru</option>
            </select>
                <button id="view-favorites-btn" class="favorite-btn">
                    ❤️ 保存済み画像を見る
                </button>
        </div>
        <div id="status"></div>
    </div>

    <div id="app"></div>
    <div id="sentinel" style="height: 100px; clear: both; background: transparent;"></div>

    <script>
        let currentPage = 0;
        let isLoading = false;
        let hasMore = true;
        let isSearchStarted = false;

        // お気に入りリストをlocalStorageから読み込む
        let likedPosts = JSON.parse(localStorage.getItem('likedPosts')) || [];

        function newSearch() {
            document.getElementById('app').innerHTML = '';
            currentPage = 0;
            hasMore = true;
            isSearchStarted = true;
            search();
        }

        async function search() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            document.getElementById('status').innerText = "読み込み中...";

            const searchInput = document.getElementById('search');
            const minScoreInput = document.getElementById('min_score');
            const siteSelect = document.getElementById('site-select');
            
            const query = searchInput.value.trim();
            const minScore = minScoreInput.value || 0;
            const site = siteSelect ? siteSelect.value : 'rule34';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&p=${currentPage}&s=${minScore}&site=${site}`);
                const data = await response.json();

                if (!data || data.length === 0) {
                    hasMore = false;
                    if (currentPage === 0) {
                        document.getElementById('app').innerHTML = '<p style="text-align:center; width:100%;">これ以上の作品はありません。</p>';
                    }
                } else {
                    renderPosts(data);
                    currentPage++;
                    document.getElementById('status').innerText = "";
                }
            } catch (e) {
                console.error("Search Error:", e);
                document.getElementById('status').innerText = "エラーが発生しました。";
            } finally {
                isLoading = false;
            }
        }
        function renderPosts(posts) {
            const app = document.getElementById('app');
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const proxiedUrl = `/img?url=${encodeURIComponent(post.previewUrl || post.file_url || post.url)}`; // Added file_url for robustness
                const postData = encodeURIComponent(JSON.stringify(post));
                const isLiked = likedPosts.some(p => String(p.id) === String(post.id));
                const rawDate = post.createdAt || post.created_at;

                card.innerHTML = `
                    <div class="media-container">
                        <div class="date-badge">
                            ${formatDate(rawDate)}
                        </div>

                        <div class="card-buttons">
                            <button id="like-btn-${post.id}" class="like-btn ${isLiked ? 'liked' : ''}" data-post-data="${postData}">
                                ${isLiked ? '❤️' : '🤍'}
                            </button>
                            <button class="download-btn" data-post-url="${post.url}" data-post-id="${post.id}">
                                💾
                            </button>
                        </div>

                        <a href="${post.url}" target="_blank">
                            <img src="${proxiedUrl}" alt="post" loading="lazy">
                        </a>

                        <div class="score-badge">
                            ★ ${post.score}
                        </div>
                    </div>
                    
                    <div class="tags-container">
                        ${post.tags.split(' ').map(tag => `<span class="tag" onclick="jumpToTag('${tag}')">${tag}</span>`).join('')}
                    </div>
                `;
                app.appendChild(card);
            });
        }
        function toggleLike(encodedPostData) {
            const post = JSON.parse(decodeURIComponent(encodedPostData));
            const btn = document.getElementById(`like-btn-${post.id}`);
            const index = likedPosts.findIndex(p => String(p.id) === String(post.id));

            if (index === -1) {
                likedPosts.push(post);
                if (btn) {
                    btn.innerText = '❤️';
                    btn.classList.add('liked'); // CSSでアニメーションを制御
                }
            } else {
                likedPosts.splice(index, 1);
                if (btn) {
                    btn.innerText = '🤍';
                    btn.classList.remove('liked');
                }
            }

            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
        }

        function formatDate(dateStr) {
            if (!dateStr) return "不明";
            const date = new Date(dateStr);
            return isNaN(date.getTime()) ? "不明" : date.toLocaleDateString('ja-JP');
        }

        function jumpToTag(tagName) {
            const searchInput = document.getElementById('search');
            const currentText = searchInput.value.trim();
            const tags = currentText ? currentText.split(/\s+/) : [];
            if (!tags.includes(tagName)) {
                tags.push(tagName);
                searchInput.value = tags.join(" ");
                newSearch();
            }
        }

        async function downloadImage(url, id) {
            try {
                const response = await fetch(`/img?url=${encodeURIComponent(url)}`);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `booru_${id}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                console.error("保存失敗:", e);
            }
        }

        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting && isSearchStarted && !isLoading && hasMore) {
                search();
            }
        }, { rootMargin: '200px' });

        document.addEventListener('DOMContentLoaded', () => {
            // Initial search if no search has been started yet (e.g., first load)
            if (!isSearchStarted) {
                newSearch();
            }

            // Event Listeners for buttons and select
            document.getElementById('clear-search-btn').addEventListener('click', () => {
                document.getElementById('search').value = '';
                newSearch();
            });
            document.getElementById('search-btn').addEventListener('click', newSearch);
            document.getElementById('site-select').addEventListener('change', newSearch);
            document.getElementById('view-favorites-btn').addEventListener('click', () => {
                window.open('/favorites', '_blank');
            });
            document.getElementById('app').addEventListener('click', (event) => {
                if (event.target.classList.contains('like-btn')) {
                    event.stopPropagation();
                    toggleLike(event.target.dataset.postData);
                } else if (event.target.classList.contains('download-btn')) {
                    event.stopPropagation();
                    downloadImage(event.target.dataset.postUrl, event.target.dataset.postId);
                } else if (event.target.classList.contains('tag')) {
                    jumpToTag(event.target.textContent);
                }
            });
            // Add a button for Pixiv link, as it was removed from the top
            const pixivLinkBtn = document.createElement('button');
            pixivLinkBtn.textContent = 'Pixiv版を開く';
            pixivLinkBtn.classList.add('pixiv-btn');
            pixivLinkBtn.addEventListener('click', () => {
                location.href='/pixiv';
            });
            document.querySelector('.header').insertBefore(pixivLinkBtn, document.querySelector('.search-box'));

            observer.observe(document.getElementById('sentinel'));
        });
    </script>
</body>
</html>
