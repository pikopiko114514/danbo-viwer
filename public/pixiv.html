<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Pixiv AI Viewer (R18)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2>Pixiv Illustration Viewer</h2>
            <div class="search-box">
                <input id="search" placeholder="タグを入力..." value="AI生成">
                <button onclick="document.getElementById('search').value=''; newSearch();" style="background:#555;">クリア</button>
                <button onclick="newSearch()" style="background:#0096fa;">Pixiv検索</button>
            </div>
        <div class="controls" style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
            <button onclick="location.href='/'" style="background: #555; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer;">
                🏠 Booru版へ戻る
            </button>
        </div>
        <div id="status"></div>
    </div>

    <div id="app"></div>
    <div id="sentinel" style="height: 100px; clear: both; background: transparent;"></div>

    <script>
        let currentPage = 1; // Pixivは1ページ目から開始
        let isLoading = false;
        let hasMore = true;
        let isSearchStarted = false;

        // 検索リセット
        function newSearch() {
            document.getElementById('app').innerHTML = '';
            currentPage = 1;
            hasMore = true;
            isSearchStarted = true;
            search();
        }
        async function search() {
            if (isLoading || !hasMore) return;
            isLoading = true;

            const query = document.getElementById('search').value;
            const status = document.getElementById('status');

            status.innerText = `読み込み中... (${currentPage}ページ目)`;

            try {
                const url = `/api/pixiv/search?q=${encodeURIComponent(query)}&p=${currentPage}`;
                const response = await fetch(url);
                const data = await response.json();

                if (!data || data.length === 0) {
                    hasMore = false;
                    status.innerText = "これ以上の投稿はありません。";
                } else {
                    // スコアフィルタを削除し、全データを描画
                    renderPixivPosts(data); 
                    
                    currentPage++;
                    status.innerText = "";
                }
            } catch (e) {
                console.error("Pixiv Search failed", e);
                status.innerText = "エラーが発生しました。";
            } finally {
                isLoading = false;
            }
        }

        // 描画関数からもスコアバッジを削除
        function renderPixivPosts(posts) {
            const app = document.getElementById('app');
            posts.forEach(post => {
                if (!post.url) return;
                const card = document.createElement('div');
                card.className = 'card';
                const proxiedUrl = `/img?url=${encodeURIComponent(post.url)}`;

                // 枚数が2枚以上の時だけラベルを表示する
                const pageBadge = post.pageCount > 1 ? `<div class="page-badge">📄 ${post.pageCount}</div>` : '';

                card.innerHTML = `
                    <div class="media-container" style="position: relative;">
                        <a href="https://www.pixiv.net/artworks/${post.id}" target="_blank" style="display: block; width: 100%; height: 100%;">
                            <div style="width: 100%; height: 250px; background: #222;">
                                <img src="${proxiedUrl}" 
                                    style="width: 100%; height: 100%; object-fit: cover;" 
                                    loading="lazy">
                            </div>
                        </a>
                        ${pageBadge}
                    </div>
                    <div class="tags-container">
                        ${post.tags ? post.tags.split(' ').map(tag => `<span class="tag">${tag}</span>`).join('') : ''}
                    </div>
                `;
                app.appendChild(card);
            });
        }
        

        // スタイル（CSS）にバッジの見た目を追加
        const style = document.createElement('style');
        style.textContent = `
            .page-badge {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.75);
                color: white;
                padding: 3px 8px;
                border-radius: 6px;
                font-size: 13px;
                font-weight: bold;
                 z-index: 5; /* 追加 */
                pointer-events: none;
                display: flex;
                align-items: center;
                gap: 4px;
            }
        `;
        document.head.appendChild(style);

        // スクロール検知（無限スクロール実装）
        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting && isSearchStarted && !isLoading && hasMore) {
                search();
            }
        }, { rootMargin: '400px' }); // 早めに読み込むよう余裕を持たせる

        observer.observe(document.getElementById('sentinel'));
    </script>

    <style>
        /* 必要最低限のスタイル（style.cssを読み込んでいる前提ですが、Pixiv専用の微調整） */
        .media-container { position: relative; overflow: hidden; border-radius: 8px; }
        .score-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            color: #ffcc00;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</body>
</html>
