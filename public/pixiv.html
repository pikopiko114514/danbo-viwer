<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Pixiv AI Viewer (R18)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2>Pixiv Illustration Viewer</h2>
            <div class="search-box">
                <input id="search" placeholder="タグを入力..." value="AI生成">
                <button onclick="document.getElementById('search').value=''; newSearch();" style="background:#555;">クリア</button>
                <button onclick="newSearch()" style="background:#0096fa;">Pixiv検索</button>
            </div>
        <div class="controls" style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
            <button onclick="location.href='/'" style="background: #555; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer;">
                🏠 Booru版へ戻る
            </button>
        </div>
        <div id="status"></div>
    </div>

    <div id="app"></div>
    <div id="sentinel" style="height: 100px; clear: both; background: transparent;"></div>

    <script>
        let currentPage = 1; // Pixivは1ページ目から開始
        let isLoading = false;
        let hasMore = true;
        let isSearchStarted = false;
        let currentUserId = null; // 現在の作者検索モードを保持

        // 検索リセット
        function newSearch() {
            currentUserId = null; // キーワード検索時はリセット
            document.getElementById('app').innerHTML = '';
            currentPage = 1;
            hasMore = true;
            isSearchStarted = true;
            search();
        }
        async function search() {
            if (isLoading || !hasMore) return;
            isLoading = true;

            const query = document.getElementById('search').value;
            const status = document.getElementById('status');

            status.innerText = `読み込み中... (${currentPage}ページ目)`;

            try {
                // userIdがある場合はそちらを優先、ない場合はキーワード検索
                let url = `/api/pixiv/search?p=${currentPage}`;
                if (currentUserId) {
                    url += `&userId=${currentUserId}`;
                } else {
                    url += `&q=${encodeURIComponent(query)}`;
                }
                                
                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed");
                }

                if (!data || data.length === 0) {
                    hasMore = false;
                    status.innerText = "これ以上の投稿はありません。";
                } else {
                    // スコアフィルタを削除し、全データを描画
                    renderPixivPosts(data); 
                    
                    currentPage++;
                    status.innerText = "";
                }
            } catch (e) {
                console.error("Pixiv Search failed", e);
                status.innerText = e.message;
            } finally {
                isLoading = false;
            }
        }
        function searchByAuthor(userId, userName) {
            document.getElementById('app').innerHTML = ''; // 画面クリア
            currentPage = 1;
            hasMore = true;
            isSearchStarted = true;
            
            currentUserId = userId; // 作者モードON
            
            const status = document.getElementById('status');
            status.innerHTML = `作者: <strong>${userName}</strong> の作品を表示中 
                <button onclick="resetToKeywordSearch()" style="margin-left:10px; font-size:12px;">キーワード検索に戻る</button>`;
            
            search();
        }

        // キーワード検索に戻す
        function resetToKeywordSearch() {
            currentUserId = null;
            newSearch();
        }
        function renderPixivPosts(posts) {
            const app = document.getElementById('app');
            posts.forEach(post => {
                if (!post.url) return;
                const card = document.createElement('div');
                card.className = 'card';
                const proxiedUrl = `/img?url=${encodeURIComponent(post.url)}`;

                // 日付バッジ
                const dateBadge = post.date ? `<div class="date-badge">${post.date}</div>` : '';
                // 枚数バッジ
                const pageBadge = post.pageCount > 1 ? `<div class="page-badge">📄 ${post.pageCount}</div>` : '';
                // 作者
                const authorHtml = post.userName 
                ? `<div class="author-info">
                    by <span class="author-link" onclick="searchByAuthor('${post.userId}', '${post.userName}')" style="color: #0096fa; cursor: pointer; font-weight: bold;">${post.userName}</span>
                </div>` 
                : '';
                
                card.innerHTML = `
                    <div class="media-container" style="position: relative;">
                        <a href="https://www.pixiv.net/artworks/${post.id}" target="_blank" style="display: block;">
                            <div style="width: 100%; height: 250px; background: #222;">
                                <img src="${proxiedUrl}" style="width: 100%; height: 100%; object-fit: cover;" loading="lazy">
                            </div>
                        </a>
                        ${dateBadge}
                        ${pageBadge}
                        <div class="button-group">
                            <button class="bookmark-btn" onclick="addBookmark('${post.id}', this)">❤</button>
                        </div>
                    </div>
                    ${authorHtml}
                    <div class="tags-container">
                        ${post.tags ? post.tags.split(' ').map(tag => `<span class="tag">${tag}</span>`).join('') : ''}
                    </div>
                `;
                app.appendChild(card);
            });
        }
        
        // 2. ポップアップ方式のブックマーク関数（確実な方法）
        function addBookmark(id, btnElement) {
            const url = `https://www.pixiv.net/bookmark_add.php?type=illust&illust_id=${id}`;
            const width = 500;
            const height = 600;
            const left = (window.screen.width / 2) - (width / 2);
            const top = (window.screen.height / 2) - (height / 2);
            
            window.open(url, 'pixiv_bookmark', `width=${width},height=${height},top=${top},left=${left},scrollbars=yes`);
            
            // 押し間違い防止のために色を変える
            btnElement.style.background = "#ff4081";
        }

        // 3. スタイルの修正（日付バッジを追加）
        const style = document.createElement('style');
        style.textContent = `
            .page-badge, .date-badge {
                position: absolute;
                background: rgba(0, 0, 0, 0.75);
                color: white;
                padding: 3px 8px;
                border-radius: 6px;
                font-size: 12px;
                font-weight: bold;
                z-index: 5;
                pointer-events: none;
            }

            .page-badge { top: 10px; right: 10px; }
            .date-badge { top: 10px; left: 10px; font-family: monospace; }

            .button-group {
                position: absolute;
                bottom: 8px;
                right: 8px;
                z-index: 10;
            }

            .bookmark-btn {
                border: none;
                border-radius: 4px;
                padding: 6px 14px;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                font-size: 18px;
                cursor: pointer;
                transition: background 0.2s;
            }
            .bookmark-btn:hover { background: #ff4081; }

            .date-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            z-index: 5;
            }

        .author-info {
            padding: 4px 8px;
            font-size: 12px;
            color: #aaa;
            text-align: left;
        }
        .author-info a {
            color: #0096fa;
            text-decoration: none;
            font-weight: bold;
        }
        .author-info a:hover {
            text-decoration: underline;
        }
        `;
        document.head.appendChild(style);

        // スクロール検知（無限スクロール実装）
        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting && isSearchStarted && !isLoading && hasMore) {
                search();
            }
        }, { rootMargin: '400px' }); // 早めに読み込むよう余裕を持たせる

        observer.observe(document.getElementById('sentinel'));
    </script>

    <style>
        /* 必要最低限のスタイル（style.cssを読み込んでいる前提ですが、Pixiv専用の微調整） */
        .media-container { position: relative; overflow: hidden; border-radius: 8px; }
        .score-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            color: #ffcc00;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</body>
</html>
